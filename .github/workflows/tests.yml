name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Static check (fails only on undefined names or syntax errors)
        run: |
          python -m pyflakes $(git ls-files '*.py') > pyflakes.txt || true
          ! grep -E ": undefined name |invalid syntax|SyntaxError" pyflakes.txt
      - name: Tests (synthetic data only; no keys, no network)
        run: python -m pytest -q -p no:cacheprovider tests
